
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diwali QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Arial, sans-serif;
      background: #160d24;
      color: white;
      text-align: center;
    }

    .card {
      max-width: 440px;
      margin: 20px auto;
      padding: 24px 18px;
      background: #281638;
      border-radius: 20px;
    }

    h1 { color: #ffd166; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #ffd166;
      color: #24132f;
      font-size: 16px;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .hint {
      color: #d9cde4;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🪔 Diwali QR Scanner</h1>
    <p class="hint">Camera test — scan a QR code to check that your camera works.</p>

    <button id="startButton" onclick="startCamera()">
      📷 Start Camera
    </button>

    <div id="reader"></div>
    <p id="status" role="status" aria-live="polite">
      Tap Start Camera to begin.
    </p>
  </div>

  <script>
    let scanner = null;
    let starting = false;

    function showStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function startCamera() {
      if (starting || scanner) return;

      starting = true;
      document.getElementById("startButton").disabled = true;
      showStatus("Requesting camera access...");

      try {
        if (!window.isSecureContext) {
          throw new Error(
            "This page is not using a secure HTTPS connection. Open your GitHub Pages HTTPS URL."
          );
        }

        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "QR scanner library failed to load. Check your internet connection and reload the page."
          );
        }

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 240, height: 240 } },
          function(decodedText) {
            showStatus("QR detected: " + decodedText);
          },
          function() {}
        );

        showStatus("Camera is working! Point it at a QR code. ✅");
      } catch (error) {
        scanner = null;
        showStatus(
          "Camera error: " +
          (error && error.message ? error.message : String(error))
        );
      } finally {
        starting = false;
        document.getElementById("startButton").disabled = false;
      }
    }
  </script>
</body>
</html>
