
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diwali Party Entry Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #171321; color: white;
      text-align: center;
    }
    .card {
      max-width: 480px; margin: auto; padding: 20px;
      background: #282238; border-radius: 18px;
    }
    h1 { color: #ffcf70; }
    input, button {
      width: 100%; padding: 13px; margin: 8px 0;
      border-radius: 9px; font-size: 16px;
    }
    input { border: 1px solid #aaa; }
    button {
      border: 0; background: #ffcf70;
      color: #20152b; font-weight: bold; cursor: pointer;
    }
    #reader { margin-top: 15px; }
    #result {
      margin-top: 18px; padding: 15px;
      border-radius: 10px; background: #393047;
      overflow-wrap: anywhere;
    }
    .allowed { color: #8cffae; }
    .denied { color: #ff9292; }
    .info { color: #ffdc8e; }
    .small { color: #c9c2d5; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🪔 Diwali Entry Gate</h1>
    <p>Scan the ticket. Let the superstar in!</p>

    <input
      id="staffPin"
      type="password"
      placeholder="Enter staff passphrase"
      autocomplete="off"
    >

    <button id="startBtn" onclick="startCamera()">
      Start Camera
    </button>
    <button id="stopBtn" onclick="stopCamera()" hidden>
      Stop Camera
    </button>

    <div id="reader"></div>

    <div id="result" role="status" aria-live="polite">
      Camera ready. Enter the staff passphrase to begin.
    </div>

    <p class="small">
      Keep this page open at the entry gate.
    </p>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwTDVV1qU2LFB30XxHLsUKvYs_XlYHkxMf16BLSZl57ccd4dRD1A_192XXTjFuM-ncH/exec";

    let scanner = null;
    let busy = false;
    let callbackCounter = 0;

    const resultBox = document.getElementById("result");

    function showResult(message, type) {
      resultBox.className = type || "info";
      resultBox.textContent = message;
    }

    async function startCamera() {
      if (!document.getElementById("staffPin").value.trim()) {
        showResult("Oye staff! Pehle passphrase toh daalo. 🔐", "denied");
        return;
      }

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          async (decodedText) => {
            if (busy) return;
            busy = true;

            showResult("Ticket check ho raha hai... 🎬", "info");

            try {
              await validateTicket(decodedText.trim());
            } catch (error) {
              showResult(
                "Connection error! Internet check karo aur dobara try karo.",
                "denied"
              );
            } finally {
              // Prevent repeated reads of the same QR for a short time.
              setTimeout(() => { busy = false; }, 2500);
            }
          }
        );

        document.getElementById("startBtn").hidden = true;
        document.getElementById("stopBtn").hidden = false;
        showResult("Camera on hai! Ab QR scan karo. 📸", "info");
      } catch (error) {
        showResult(
          "Camera nahi chala: " + (error.message || error),
          "denied"
        );
      }
    }

    async function stopCamera() {
      if (scanner && scanner.isScanning) {
        await scanner.stop();
      }
      document.getElementById("startBtn").hidden = false;
      document.getElementById("stopBtn").hidden = true;
      showResult("Camera stopped.", "info");
    }

    function validateTicket(code) {
      return new Promise((resolve, reject) => {
        const pin = document.getElementById("staffPin").value;

        // JSONP lets GitHub Pages call Apps Script without a CORS fetch.
        const callbackName =
          "diwaliCallback" + Date.now() + (++callbackCounter);

        const script = document.createElement("script");
        let finished = false;

        function cleanup() {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          script.remove();
          delete window[callbackName];
        }

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Request timed out"));
        }, 15000);

        window[callbackName] = (data) => {
          cleanup();

          if (!data || !data.status) {
            reject(new Error("Invalid server response"));
            return;
          }

          if (data.status === "ALLOWED") {
            showResult("✅ " + data.message, "allowed");
          } else {
            showResult("❌ " + data.message, "denied");
          }

          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Could not reach Apps Script"));
        };

        const params = new URLSearchParams({
          action: "validate",
          code: code,
          pin: pin,
          callback: callbackName
        });

        script.src = API_URL + "?" + params.toString();
        document.body.appendChild(script);
      });
    }
  </script>
</body>
</html>
