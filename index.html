
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diwali Party</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; text-align: center;
      color: white; background: #171321;
    }
    .card {
      width: 100%; max-width: 480px; padding: 24px;
      border-radius: 18px; background: #282238;
    }
    h1 { color: #ffcf70; }
    input, button {
      width: 100%; padding: 13px; margin: 8px 0;
      border-radius: 9px; font-size: 16px;
    }
    input { border: 1px solid #aaa; }
    button {
      border: 0; background: #ffcf70;
      color: #20152b; font-weight: bold; cursor: pointer;
    }
    #reader { margin-top: 15px; }
    #result {
      margin-top: 16px; padding: 14px;
      border-radius: 10px; background: #393047;
      overflow-wrap: anywhere;
    }
    .allowed { color: #8cffae; }
    .denied { color: #ff9292; }
    .info { color: #ffdc8e; }
    .small { color: #c9c2d5; font-size: 13px; }
    .ticket { font-size: 20px; font-weight: bold; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h1>🪔 Diwali Party</h1>
    <p>Loading...</p>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwTDVV1qU2LFB30XxHLsUKvYs_XlYHkxMf16BLSZl57ccd4dRD1A_192XXTjFuM-ncH/exec";

    const app = document.getElementById("app");
    const ticket = new URLSearchParams(location.search).get("ticket");

    // GUEST VIEW: opened from a ticket QR code.
    if (ticket) {
      app.innerHTML = `
        <h1>🎉 You're Invited! 🪔</h1>
        <p>Welcome, Superstar!</p>
        <p>Get ready for a night of lights, music and masti.</p>
        <p>Your ticket code:</p>
        <div class="ticket" id="guestCode"></div>
        <p class="small">
          Show this ticket to the entry staff. Your entry is confirmed
          only after staff validates your ticket.
        </p>
      `;
      document.getElementById("guestCode").textContent = ticket;
    } else {
      // STAFF VIEW: opened without a ticket parameter.
      app.innerHTML = `
        <h1>🪔 Diwali Entry Gate</h1>
        <p>Scan the ticket. Let the superstar in!</p>
        <input id="staffPin" type="password"
          placeholder="Enter staff passphrase" autocomplete="off">
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn" hidden>Stop Camera</button>
        <div id="reader"></div>
        <div id="result" role="status" aria-live="polite">
          Enter staff passphrase to begin.
        </div>
      `;

      let scanner = null;
      let busy = false;
      let callbackCounter = 0;
      const resultBox = document.getElementById("result");

      function showResult(message, type) {
        resultBox.className = type || "info";
        resultBox.textContent = message;
      }

      function extractTicketCode(scannedText) {
        try {
          const url = new URL(scannedText);
          const code = url.searchParams.get("ticket");
          if (code) return code.trim();
        } catch (e) {
          // It may be a plain ticket code from an older QR.
        }
        return scannedText.trim();
      }

      document.getElementById("startBtn").onclick = async () => {
        if (!document.getElementById("staffPin").value.trim()) {
          showResult("Oye staff! Pehle passphrase toh daalo. 🔐", "denied");
          return;
        }

        try {
          if (!scanner) scanner = new Html5Qrcode("reader");

          await scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            async (decodedText) => {
              if (busy) return;
              busy = true;
              showResult("Ticket check ho raha hai... 🎬", "info");

              try {
                await validateTicket(extractTicketCode(decodedText));
              } catch (e) {
                showResult(
                  "Connection error! Internet check karo aur dobara try karo.",
                  "denied"
                );
              } finally {
                setTimeout(() => { busy = false; }, 2500);
              }
            }
          );

          document.getElementById("startBtn").hidden = true;
          document.getElementById("stopBtn").hidden = false;
          showResult("Camera on hai! Ab QR scan karo. 📸", "info");
        } catch (e) {
          showResult("Camera nahi chala: " + (e.message || e), "denied");
        }
      };

      document.getElementById("stopBtn").onclick = async () => {
        if (scanner && scanner.isScanning) await scanner.stop();
        document.getElementById("startBtn").hidden = false;
        document.getElementById("stopBtn").hidden = true;
        showResult("Camera stopped.", "info");
      };

      function validateTicket(code) {
        return new Promise((resolve, reject) => {
          const pin = document.getElementById("staffPin").value;
          const callbackName =
            "diwaliCallback" + Date.now() + (++callbackCounter);
          const script = document.createElement("script");
          let finished = false;

          function cleanup() {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            script.remove();
            delete window[callbackName];
          }

          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out"));
          }, 15000);

          window[callbackName] = (data) => {
            cleanup();
            if (!data || !data.status) {
              reject(new Error("Invalid server response"));
              return;
            }

            showResult(
              (data.status === "ALLOWED" ? "✅ " : "❌ ") + data.message,
              data.status === "ALLOWED" ? "allowed" : "denied"
            );
            resolve(data);
          };

          script.onerror = () => {
            cleanup();
            reject(new Error("Could not reach Apps Script"));
          };

          const params = new URLSearchParams({
            action: "validate",
            code: code,
            pin: pin,
            callback: callbackName
          });

          script.src = API_URL + "?" + params.toString();
          document.body.appendChild(script);
        });
      }
    }
  </script>
</body>
</html>
